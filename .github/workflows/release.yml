name: Release

# Push a tag like v2.0.0 to build the portable exe and the installer and publish
# them as a GitHub release. The tag must match aqj.__version__ and have a
# CHANGELOG entry.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import aqj; print(aqj.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match aqj.__version__ $version"; exit 1
          fi
          python tools/release_notes.py "$version" > release-notes.md

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        env:
          CI: "1"
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: build.bat all

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Arma Queue Joiner ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            dist/ArmaQueueJoiner.exe \
            dist/ArmaQueueJoiner-*-setup.exe
