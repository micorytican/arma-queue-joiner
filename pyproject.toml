[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arma-queue-joiner"
description = "Keeps clicking Join on a full Arma Reforger server until you are in the queue."
readme = "README.md"
license = "MIT"
authors = [{ name = "lime98 aka micorytican" }]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "mss==10.2.0",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "basedpyright>=1.20",
    "pyinstaller>=6.11",
]

[project.urls]
Source = "https://github.com/micorytican/arma-queue-joiner"

[tool.setuptools.dynamic]
version = { attr = "aqj.__version__" }

[tool.setuptools.packages.find]
include = ["aqj*"]

[project.gui-scripts]
arma-queue-joiner = "aqj.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["desktop: needs a real Windows desktop session (skipped in CI)"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "N", "RUF"]
ignore = [
    "N802",    # Qt overrides use camelCase (paintEvent, sizeHint)
    "RUF001",  # Ukrainian strings contain letters that look like Latin ones
    "RUF012",
]

[tool.basedpyright]
include = ["aqj"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingModuleSource = false
